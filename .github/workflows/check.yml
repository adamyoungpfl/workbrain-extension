# The gate, off Adam's machine.
#
# `npm run check` is the definition of done (CLAUDE.md), and until now the only
# place it ran was the laptop it was written on. That made every slice cost six
# to twenty minutes of a machine that was also running Chrome and an editor —
# and worse, made the result depend on how busy that machine happened to be.
# Nine timing tests failed on 2026-09-02 and all nine passed serially minutes
# later. A gate that answers differently depending on what else is open is not
# a gate.
#
# ── TWO JOBS, IN PARALLEL, AND THAT IS THE WHOLE POINT ────────────────────
# `fast` is everything that does not need a browser — typecheck, the guardrail
# audit, 2100 unit tests, the build. About thirty seconds. `browser` is the
# 680 Playwright tests, about six minutes.
#
# They run at the same time rather than in sequence. A typo or a broken
# guardrail comes back in half a minute instead of at the end of the slow half,
# and the slow half is not delayed by waiting to be told the code compiles.
# Total wall clock is the slower of the two, not the sum.
#
# `browser` deliberately does NOT `needs: fast`. Making it wait would trade the
# parallelism away to save a runner-minute on the rare commit where both fail,
# and the thing being bought here is feedback speed.
name: check

on:
  push:
    branches: ['**']
  pull_request:
  # So a red run can be re-tried after a flake without an empty commit.
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless. Cancelling
# keeps the queue honest and the feedback fast.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: typecheck · audit · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the local runtime. `npm ci` is deterministic from the
          # lockfile; `npm install` would let CI resolve different versions
          # from the machine that wrote the lock, which is how a green CI and
          # a red laptop start disagreeing.
          node-version: 24
          cache: npm
      - run: npm ci
      # No `playwright install` here: this half never opens a browser, and
      # downloading one would cost more than everything it runs.
      - run: npm run check:fast

  browser:
    name: e2e · a11y
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The browser the tests actually launch: `channel: 'chromium'`, which is
      # Playwright's own build rather than the system Chrome. `--with-deps`
      # pulls the shared libraries a headless Chromium needs on a bare runner.
      - run: npx playwright install --with-deps chromium

      # `check:e2e` builds first, so this job is self-contained rather than
      # depending on an artifact from the other one. The build is about a
      # second; passing a dist between jobs would cost more than that in
      # upload and download, and would add a way for the two halves to test
      # different code.
      #
      # `xvfb-run` because these are EXTENSION tests. They use
      # `launchPersistentContext` with `--load-extension`, and extension
      # support is the one place headless Chromium has historically been
      # fragile. A virtual display costs nothing and removes the question.
      #
      # GitHub sets CI=true, which is what turns on `retries: 2` in
      # playwright.config.ts — so a timing test that blips gets two more goes
      # and is reported as FLAKY rather than as a failure. Flaky is visible;
      # it just does not stop the build.
      - run: xvfb-run -a npm run check:e2e

      # Screenshots and traces from anything that did fail. Without this a red
      # run tells you a name and nothing else, which is worse than the laptop
      # it replaced.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
